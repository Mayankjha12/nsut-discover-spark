name: nsut_hub
description: "NSUT Hub — Discover. Save. Participate. A student discovery platform for NSUT, Delhi."
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27+ (Color.withValues, TextScaler.clamp are used)
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking (REST-ready data layer)
  dio: ^5.5.0

  # Local persistence / offline cache
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

  # --- Firebase (uncomment once `flutterfire configure` has been run) ---
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # firebase_messaging: ^15.0.4
  # firebase_storage: ^12.1.3
  # flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
