services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your server hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: nsut_hub
      SCHEDULE_ADMIN_TOKEN: ${SCHEDULE_ADMIN_TOKEN:-}
      CORS_ORIGINS: https://${APP_DOMAIN}
      SCHEDULE_MAX_AGE_SECONDS: ${SCHEDULE_MAX_AGE_SECONDS:-86400}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - mongo
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
  caddy_data:
  caddy_config:
